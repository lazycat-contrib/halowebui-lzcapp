name: HaloWebUI
package: community.lazycat.app.halowebui
version: 1.0.0
min_os_version: 1.3.8
description: "基于 Open WebUI 深度定制，原生集成 Anthropic Claude / Google Gemini / xAI Grok，内置 HaloClaw 消息网关，一站式管理你的所有大模型。"
license: MIT
homepage: https://github.com/ztx888/halowebui
author: ztx888

application:
  subdomain: halowebui
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://halowebui-app:8080/

services:
  halowebui-app:
    # ghcr.io/ztx888/halowebui:latest
    image: registry.lazycat.cloud/czyt/ztx888/halowebui:24fc064df6ddff10
    environment:
      - TZ={{.U.tz}}
    binds:
      - /lzcapp/var/data:/app/backend/data

locales:
  en:
    name: "HaloWebUI"
    description: "HaloWebUI is a deeply customized version of Open WebUI, natively integrating Anthropic Claude, Google Gemini, and xAI Grok. With the built-in HaloClaw message gateway, it provides a one-stop solution to manage all your large models."
  zh:
    name: "HaloWebUI"
    description: "基于 Open WebUI 深度定制，原生集成 Anthropic Claude / Google Gemini / xAI Grok，内置 HaloClaw 消息网关，一站式管理你的所有大模型。"
