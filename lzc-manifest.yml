application:
  subdomain: halowebui
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://halowebui-app:8080/

services:
  halowebui-app:
    # ghcr.io/ztx888/halowebui:latest
    image: ghcr.1ms.run/ztx888/halowebui:latest@sha256:8213eaa1c0909c6b74bcd54d3fafb3060c506b2f7541bfa775e910148a544c2e
    environment:
      - TZ={{.U.tz}}
    binds:
      - /lzcapp/var/data:/app/backend/data
